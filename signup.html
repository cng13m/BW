<!doctype html>
<html lang="sq">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Regjistro sallonin - Bukuri</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Faqja kryesore Bukuri">
        <span class="brand-mark">B</span>
        <span>
          <strong>Bukuri</strong>
          <small>Per sallone</small>
        </span>
      </a>
      <nav class="nav-actions" aria-label="Navigimi kryesor">
        <a class="secondary-button nav-link" href="login.html">Kycu</a>
      </nav>
    </header>

    <main class="auth-page">
      <section class="auth-copy">
        <p class="kicker">Per pronare sallonesh</p>
        <h1>Hap profilin e sallonit tend.</h1>
        <p>Regjistrohu, shto sherbimet dhe prano kerkesa per termine nga klientet ne Kosove.</p>
      </section>

      <form class="auth-card" id="signupForm">
        <h2>Regjistro sallonin</h2>
        <label>
          Emri i pronarit
          <input required name="ownerName" autocomplete="name" placeholder="Emri dhe mbiemri">
        </label>
        <label>
          Email
          <input required name="email" type="email" autocomplete="email" placeholder="email@salloni.com">
        </label>
        <label>
          Fjalekalimi
          <input required name="password" type="password" autocomplete="new-password" minlength="6" placeholder="Minimum 6 karaktere">
        </label>
        <label>
          Emri i sallonit
          <input required name="salonName" placeholder="Emri i sallonit">
        </label>
        <div class="form-row">
          <label>
            Qyteti
            <input required name="city" placeholder="Prishtina">
          </label>
          <label>
            Telefoni
            <input required name="phone" autocomplete="tel" placeholder="+383...">
          </label>
        </div>
        <label>
          Adresa
          <input name="address" placeholder="Lagjja ose adresa">
        </label>
        <label>
          Instagram
          <input name="instagram" placeholder="@salloni">
        </label>
        <label>
          Pershkrimi
          <textarea name="description" rows="3" placeholder="P.sh. Sallon flokesh per femra ne Prishtine"></textarea>
        </label>
        <button class="primary-button" type="submit">Krijo llogarine</button>
        <p class="form-note">Pas regjistrimit hapet dashboardi ku mund te shtosh sherbime.</p>
      </form>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="signup.js"></script>
  </body>
</html>
